name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # We need build tools on Ubuntu to build native SQLite/bcrypt if running npm ci locally in CI
          sudo apt-get update && sudo apt-get install -y build-essential python3
          npm install

      - name: Run Jest Unit Tests
        run: |
          npm test

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Do not push to registry in CI test phase, just verify build
          tags: event-management:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
